# Enable mouse keys (central side only)
CONFIG_ZMK_POINTING=y
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# Improve BLE reconnection after macOS sleep/wake
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Uncomment to enable RGB LED
# CONFIG_ZMK_RGB_UNDERGLOW=y

# CONFIG_WS2812_STRIP=y

# Turn on underglow when the keyboard starts
# CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y

# Set the startup effect to Swirl (a nice color cycling effect)
# Other options: 0=Solid, 1=Breathe, 2=Spectrum, 4=Knight
# CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

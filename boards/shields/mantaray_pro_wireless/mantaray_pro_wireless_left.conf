# Mouse keys (central side only). Disabled; the mouse layers are commented out in the keymap.
# CONFIG_ZMK_POINTING=y
# CONFIG_INPUT_THREAD_STACK_SIZE=2048

# NOTE: CONFIG_ZMK_BLE_EXPERIMENTAL_CONN helps macOS sleep/wake reconnection but
# is known to break pairing on Windows hosts ("Try connecting your device again").
# CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ZMK debounces settings saves (BT profile, etc.) by 60s by default, so switching
# profiles and powering off quickly loses the change on next boot. Shorten this.
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=3000

# Request a tighter/faster BLE connection interval so Windows settles faster after
# (re)connecting, reducing the initial lag/phantom-repeat window seen on Windows hosts.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Uncomment to enable RGB LED
# CONFIG_ZMK_RGB_UNDERGLOW=y

# CONFIG_WS2812_STRIP=y

# Turn on underglow when the keyboard starts
# CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y

# Set the startup effect to Swirl (a nice color cycling effect)
# Other options: 0=Solid, 1=Breathe, 2=Spectrum, 4=Knight
# CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
